db:
    type: 'mariadb:10.4'
    disk: 12288
    configuration:
        schemas:
            - pacnidb
            - judiciarynidb
            - boundarycommissiondb
            - interchangenidb
            - infolibrarynicsdb
            - pressclippingsnicsdb
            - parolecomnidb
            - lgbcnidb
            - semcommitteedb
            - nibureaudb
            - nicscommissionersdb
            - liofadb
            - independentpaneltruthrecoverynidb
            - horizoneuropenidb
        endpoints:
            pacni:
                default_schema: pacnidb
                privileges:
                    pacnidb: admin
            judiciaryni:
                default_schema: judiciarynidb
                privileges:
                    judiciarynidb: admin
            boundarycommission:
                default_schema: boundarycommissiondb
                privileges:
                    boundarycommissiondb: admin
            interchangeni:
                default_schema: interchangenidb
                privileges:
                    interchangenidb: admin
            infolibrarynics:
                default_schema: infolibrarynicsdb
                privileges:
                    infolibrarynicsdb: admin
            pressclippingsnics:
                default_schema: pressclippingsnicsdb
                privileges:
                    pressclippingsnicsdb: admin
            parolecomni:
                default_schema: parolecomnidb
                privileges:
                    parolecomnidb: admin
            lgbcni:
                default_schema: lgbcnidb
                privileges:
                    lgbcnidb: admin
            semcommittee:
                default_schema: semcommitteedb
                privileges:
                    semcommitteedb: admin
            nibureau:
                default_schema: nibureaudb
                privileges:
                    nibureaudb: admin
            nicscommissioners:
                default_schema: nicscommissionersdb
                privileges:
                    nicscommissionersdb: admin
            liofa:
                default_schema: liofadb
                privileges:
                    liofadb: admin
            independentpaneltruthrecoveryni:
                default_schema: independentpaneltruthrecoverynidb
                privileges:
                    independentpaneltruthrecoverynidb: admin
            horizoneuropeni:
                default_schema: horizoneuropenidb
                privileges:
                    horizoneuropenidb: admin
solr_9_9:
    type: 'solr:9.9'
    disk: 1024
    configuration:
        modules:
            - extraction
            - analysis-extras
            - langid
            - ltr
        cores:
            pacni_index:
                conf_dir: !archive solr_configsets/pacni/conf/
            judiciaryni_index:
                conf_dir: !archive solr_configsets/judiciaryni/conf/
            boundarycommission_index:
                conf_dir: !archive solr_configsets/boundarycommission/conf/
            interchangeni_index:
                conf_dir: !archive solr_configsets/interchangeni/conf/
            pressclippingsnics_index:
                conf_dir: !archive solr_configsets/pressclippingsnics/conf/
            parolecomni_index:
                conf_dir: !archive solr_configsets/parolecomni/conf/
            lgbcni_index:
                conf_dir: !archive solr_configsets/lgbcni/conf/
            semcommittee_index:
                conf_dir: !archive solr_configsets/semcommittee/conf/
            nibureau_index:
                conf_dir: !archive solr_configsets/nibureau/conf/
            nicscommissioners_index:
                conf_dir: !archive solr_configsets/nicscommissioners/conf/
            liofa_index:
                conf_dir: !archive solr_configsets/liofa/conf/
            independentpaneltruthrecoveryni_index:
                conf_dir: !archive solr_configsets/independentpaneltruthrecoveryni/conf/
            horizoneuropeni_index:
                conf_dir: !archive solr_configsets/horizoneuropeni/conf/
        endpoints:
            pacni:
                core: pacni_index
            judiciaryni:
                core: judiciaryni_index
            boundarycommission:
                core: boundarycommission_index
            interchangeni:
                core: interchangeni_index
            pressclippingsnics:
                core: pressclippingsnics_index
            parolecomni:
                core: parolecomni_index
            lgbcni:
                core: lgbcni_index
            semcommittee:
                core: semcommittee_index
            nibureau:
                core: nibureau_index
            nicscommissioners:
                core: nicscommissioners_index
            liofa:
                core: liofa_index
            independentpaneltruthrecoveryni:
                core: independentpaneltruthrecoveryni_index
            horizoneuropeni:
                core: horizoneuropeni_index
redis:
    type: 'redis:6.0'
